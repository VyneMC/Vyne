buildscript {
    ext.asmVersion = '9.7.1'
}

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.2.2'
}

base {
    archivesName = "vyne-loader"
}

group = "dev.stolym.vyne"
version = project.vyne_version

apply from: 'gradle/repositories.gradle'
apply from: 'gradle/dependencies.gradle'
apply from: 'gradle/run.gradle'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/mock/java']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-removal']
}

apply from: 'gradle/fml.gradle'
apply from: 'gradle/bytecode.gradle'
apply from: 'gradle/shadow.gradle'
apply from: 'gradle/smoke.gradle'
