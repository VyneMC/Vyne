sourceSets {
    hooks {
        java {
            srcDirs = ['src/hooks/java']
        }
        resources {
            srcDirs = ['src/hooks/resources']
        }
    }
}

configurations {
    hooksMixin {
        transitive = false
    }
}

dependencies {
    hooksMixin 'net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7'
    hooksMixin 'io.github.llamalad7:mixinextras-fabric:0.5.5'
}

afterEvaluate {
    sourceSets.hooks.compileClasspath = project.ext.minecraftHookedOpen + sourceSets.neoforge.output +
            configurations.neoforgeLibraries + configurations.hooksMixin
}

tasks.register('hooksJar', Jar) {
    archiveBaseName = 'vyne-hooks-mojang'
    destinationDirectory = layout.buildDirectory.dir('hooks-jar')
    from sourceSets.hooks.output
}

def hooksRuntimeJar = layout.buildDirectory.file('hooks-jar/vyne-hooks.jar').get().asFile

tasks.register('remapHooksJar', JavaExec) {
    group = 'vyne'
    description = 'Renames Vyne\'s hook mixins (written with Mojang names) to the current runtime names.'
    dependsOn 'hooksJar', 'minecraftHookedJar', 'neoforgeJar', tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.stolym.vyne.tools.minecraft.RemapToRuntime'
    def work = layout.buildDirectory.dir('minecraft').get().asFile
    systemProperty 'vyne.gameDir', work.absolutePath
    inputs.files(tasks.named('hooksJar'))
    outputs.file(hooksRuntimeJar)
    def mcVersion = project.minecraft_version
    def hooksJarFile = tasks.named('hooksJar').flatMap { it.archiveFile }
    def neoforgeJarFile = tasks.named('neoforgeJar').flatMap { it.archiveFile }
    def hookedGameJar = layout.buildDirectory.file("minecraft/minecraft-${mcVersion}-hooked.jar")
    def minecraftLibraries = configurations.minecraftLibraries
    def neoforgeLibraries = configurations.neoforgeLibraries
    argumentProviders.add({
        [mcVersion,
         hooksJarFile.get().asFile.absolutePath,
         hooksRuntimeJar.absolutePath,
         hookedGameJar.get().asFile.absolutePath,
         neoforgeJarFile.get().asFile.absolutePath, '--'] +
                minecraftLibraries.files.collect { it.absolutePath } +
                neoforgeLibraries.files.collect { it.absolutePath }
    } as CommandLineArgumentProvider)
}
