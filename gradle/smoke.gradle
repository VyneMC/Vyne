def defaultSkipPrefixes = [
        'dev.stolym.vyne.mixin.',
        'dev.stolym.vyne.game.',
        'dev.stolym.vyne.fml.',
        'dev.stolym.vyne.hooks.mixin.',
        'dev.stolym.vyne.hooks.bridge.',
        'dev.stolym.vyne.compat.',
        'dev.stolym.vyne.fluid.',
        'net.minecraftforge.',
        'net.neoforged.',
        'net.fabricmc.loader.impl.game.minecraft.',
        'org.apache.logging.log4j.',
        'org.spongepowered.asm.',
        'org.lwjgl.',
        'com.terraformersmc.modmenu.api.',
        'org.apache.commons.compress.archivers.sevenz.',
        'org.apache.commons.compress.compressors.brotli.',
        'org.apache.commons.compress.compressors.lzma.',
        'org.apache.commons.compress.compressors.xz.',
        'org.apache.commons.compress.compressors.zstandard.',
        'org.apache.commons.compress.harmony.',
]

tasks.register('classLoadCheck', JavaExec) {
    group = 'verification'
    description = 'Loads every class of the shadow jar and resolves member signatures.'
    def shadow = tasks.named('shadowJar')
    dependsOn shadow, tasks.named('testClasses')

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.stolym.vyne.smoke.JarClassLoadCheck'

    doFirst {
        args = [shadow.get().archiveFile.get().asFile.absolutePath]
        def skipProp = providers.gradleProperty('smoke.skip').orElse(defaultSkipPrefixes.join(','))
        args += skipProp.get().split(',').findAll { !it.isBlank() }

        def cp = []
        cp += configurations.compileClasspath.files
        cp += configurations.runtimeClasspath.files
        cp += fileTree(dir: 'run/versions', include: ['**/*.jar']).files
        systemProperty 'check.classpath', cp*.absolutePath.join(File.pathSeparator)
    }
}

def smokeScenarios = ['fabric-only', 'neoforge-simple', 'neoforge-with-lib', 'mixed', 'mixin-fixture', 'patch-layer']
def fixtureScenarios = ['mixin-fixture', 'patch-layer']
def smokeTimeoutSeconds = providers.gradleProperty('smoke.timeout').orElse('600').get().toInteger()

def forbiddenPatterns = [
        ~/VYNE CRITICAL FAILURE/,
        ~/Exception in thread/,
        ~/NoClassDefFoundError/,
        ~/VerifyError/,
        ~/ClassCircularityError/,
        ~/\[Containment\]/,
]

def expectedPatterns = [
        'mixin-fixture': [
                ~/\[VyneFixture\] mod instance created/,
                ~/\[VyneFixture\] mixin injected into MinecraftServer\.runServer/,
                ~/\[VyneFixture\] dist-aware init: dedicated server path/,
        ],
        'patch-layer': [
                ~/\[VyneFixture\] block-break normal: result=true removed=true neoforge-break=1 fabric-before=1 fabric-after=1 fabric-canceled=0/,
                ~/\[VyneFixture\] block-break fabric-cancel: result=false removed=false neoforge-break=1 fabric-before=1 fabric-after=0 fabric-canceled=1/,
                ~/\[VyneFixture\] block-break neoforge-cancel: result=false removed=false neoforge-break=1 fabric-before=0 fabric-after=0 fabric-canceled=0/,
                ~/\[VyneFixture\] fuel: dirt=1234 coal=1600 stone=0/,
                ~/\[VyneFixture\] sleep: time-allowed=null monsters-refused=NOT_SAFE spawn-refused=true spawn-other=false continue-refused=true conversions=1/,
        ],
]

def serverCommand = { File vyneJar, String scenario ->
    def extraJvmFlags = providers.gradleProperty('smoke.noRealNeo').isPresent()
            ? ['-Dvyne.realNeoforgeApi=false'] : []
    if (providers.gradleProperty('smoke.installer').isPresent()) extraJvmFlags += ['-Dvyne.hooks=false']
    def customJvmArgs = providers.gradleProperty('smoke.jvmArgs').orNull
    if (customJvmArgs) extraJvmFlags += customJvmArgs.split(',').findAll { !it.isBlank() }
    if (scenario == 'patch-layer') extraJvmFlags += ['-Dvyne.hooks.mixed=true']
    return ['java', '-Xmx2G', '-Xms512M',
            '-Dvyne.dev=true',
            '-Djava.system.class.loader=dev.stolym.vyne.vcl.BridgeClassLoader',
            ] + extraJvmFlags + [
            '-cp', vyneJar.absolutePath,
            'dev.stolym.vyne.core.VyneLauncher',
            '--server']
}

def hasBundledLibraries = { File f ->
    if (f == null || !f.isFile()) return false
    try (def zf = new java.util.zip.ZipFile(f)) {
        return zf.getEntry('META-INF/libraries/') != null
    } catch (IOException ignored) {
        return false
    }
}

smokeScenarios.each { scenario ->
    tasks.register("smokeServer_${scenario}") {
        group = 'verification'
        description = "Boots a dedicated server with scenario '${scenario}' and checks the log."
        def shadow = tasks.named('shadowJar')
        dependsOn shadow
        if (scenario in fixtureScenarios) {
            dependsOn tasks.named('mixinFixtureJar')
        }

        doLast {
            File modsDir = project.file("smoke/scenarios/${scenario}/mods")
            if (!modsDir.isDirectory() && scenario != 'mixin-fixture') {
                throw new GradleException(
                        "Smoke scenario '${scenario}' is not provisioned: add mod jars to " +
                        "smoke/scenarios/${scenario}/mods/ (see docs/playtest.md, section 7).")
            }

            File vyneJar = shadow.get().archiveFile.get().asFile
            File runDir = layout.buildDirectory.dir("smoke/${scenario}").get().asFile
            project.delete(runDir)
            new File(runDir, 'mods').mkdirs()

            project.copy {
                from modsDir
                into new File(runDir, 'mods')
            }
            if (scenario in fixtureScenarios) {
                project.copy {
                    from tasks.named('mixinFixtureJar').get().archiveFile.get().asFile
                    into new File(runDir, 'mods')
                }
            }
            project.copy {
                from vyneJar
                into new File(runDir, 'mods')
            }
            new File(runDir, 'eula.txt').text = 'eula=true\n'
            int freePort = new ServerSocket(0).withCloseable { it.localPort }
            new File(runDir, 'server.properties').text = "server-port=${freePort}\n"


            def mcVersion = project.property('minecraft_version')
            File serverJar = new File(runDir, "minecraft_server.${mcVersion}.jar")
            if (!serverJar.exists()) {
                def explicit = providers.gradleProperty('smoke.serverJar').orNull
                File local = null
                if (explicit != null) {
                    local = project.file(explicit)
                } else {
                    def candidates = (fileTree(dir: 'run', include: ["minecraft_server.${mcVersion}.jar", 'versions/**/*.jar']).files
                            + fileTree(dir: 'run/versions', include: ["${mcVersion}/*.jar"]).files).unique()
                    local = candidates.find { f -> hasBundledLibraries(f) }
                }
                if (local == null || !local.isFile()) {
                    throw new GradleException(
                            "No vanilla server jar with bundled libraries found for the smoke test. Provide one via " +
                            "-Psmoke.serverJar=/path/to/server.jar or run the Vyne installer once " +
                            "to set up run/.")
                }
                try {
                    java.nio.file.Files.createSymbolicLink(serverJar.toPath(),
                            local.toPath())
                } catch (Exception ignored) {
                    java.nio.file.Files.copy(local.toPath(), serverJar.toPath())
                }
            }

            def proc = new ProcessBuilder(serverCommand(vyneJar, scenario))
                    .directory(runDir)
                    .redirectErrorStream(true)
                    .start()

            boolean timedOut = false
            boolean started = false
            def lines = []

            def watchdog = new Thread({
                try {
                    Thread.sleep(smokeTimeoutSeconds * 1000L)
                    if (proc.alive) { timedOut = true; proc.destroyForcibly() }
                } catch (InterruptedException ignored) { }
            })
            watchdog.daemon = true
            watchdog.start()

            proc.inputStream.eachLine { line ->
                lines << line
                if (!started && line.contains('Done (')) {
                    started = true
                    proc.outputStream.write('stop\n'.bytes)
                    proc.outputStream.flush()
                }
            }
            int exit = proc.waitFor()
            watchdog.interrupt()

            new File(runDir, 'smoke.log').text = lines.join('\n')

            def problems = []
            if (timedOut) problems << "timed out after ${smokeTimeoutSeconds}s"
            if (!started) problems << 'server never reached the "Done" line'
            if (started && exit != 0) problems << "server exited with code ${exit}"
            lines.each { l ->
                if (forbiddenPatterns.any { it.matcher(l).find() }) problems << "log: ${l.take(200)}"
            }
            (expectedPatterns[scenario] ?: []).each { pat ->
                if (!lines.any { pat.matcher(it).find() }) {
                    problems << "expected pattern not found in log: ${pat}"
                }
            }

            if (problems) {
                throw new GradleException(
                        "Smoke scenario '${scenario}' FAILED:\n  - " + problems.join('\n  - ') +
                        "\nFull log: ${new File(runDir, 'smoke.log')}")
            }
            logger.lifecycle("Smoke scenario '${scenario}' passed (log: ${new File(runDir, 'smoke.log')})")
        }
    }
}

tasks.register('smokeTest') {
    group = 'verification'
    description = 'Runs every smoke scenario.'
    dependsOn smokeScenarios.collect { "smokeServer_${it}" }
}

tasks.named('test') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('check') {
    dependsOn 'classLoadCheck'
}
