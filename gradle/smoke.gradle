tasks.register('classLoadCheck', JavaExec) {
    group = 'verification'
    description = 'Loads every class of the shadow jar and resolves member signatures.'
    def shadow = tasks.named('shadowJar')
    dependsOn shadow, tasks.named('testClasses')

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.stolym.vyne.smoke.JarClassLoadCheck'

    doFirst {
        args = [shadow.get().archiveFile.get().asFile.absolutePath]
        def skipProp = providers.gradleProperty('smoke.skip').orElse(defaultSkipPrefixes.join(','))
        args += skipProp.get().split(',').findAll { !it.isBlank() }

        def cp = []
        cp += configurations.compileClasspath.files
        cp += configurations.runtimeClasspath.files
        cp += fileTree(dir: 'run/versions', include: ['**/*.jar']).files
        systemProperty 'check.classpath', cp*.absolutePath.join(File.pathSeparator)
    }
}

def smokeScenarios = ['fabric-only', 'neoforge-simple', 'neoforge-with-lib', 'mixed', 'mixin-fixture', 'patch-layer', 'mixed-content']
def fixtureScenarios = ['mixin-fixture', 'patch-layer', 'mixed-content']
def smokeTimeoutSeconds = providers.gradleProperty('smoke.timeout').orElse('600').get().toInteger()

def forbiddenPatterns = [
        ~/VYNE CRITICAL FAILURE/,
        ~/Exception in thread/,
        ~/NoClassDefFoundError/,
        ~/VerifyError/,
        ~/ClassCircularityError/,
        ~/\[Containment\]/,
]

def firstLaunchOnly = [
        ~/\[Converter\] Remapping \d+ jar/,
        ~/\[PatchedGame\] Prepared NeoForge's patched game/,
        ~/\[RealNeoAPI\] Prepared the NeoForge API jar/,
        ~/\[MojmapDownloader\] Downloading/,
]

def expectedPatterns = [
        'mixed-content': [
                ~/\[VyneFixture\] architectury: break-fired=true pig-vetoed=true/,
        ],
        'mixin-fixture': [
                ~/\[VyneFixture\] mod instance created/,
                ~/\[VyneFixture\] mixin injected into MinecraftServer\.runServer/,
                ~/\[VyneFixture\] dist-aware init: dedicated server path/,
        ],
        'patch-layer': [
                ~/\[VyneFixture\] block-break normal: result=true removed=true neoforge-break=1 fabric-before=1 fabric-after=1 fabric-canceled=0/,
                ~/\[VyneFixture\] block-break fabric-cancel: result=false removed=false neoforge-break=1 fabric-before=1 fabric-after=0 fabric-canceled=1/,
                ~/\[VyneFixture\] block-break neoforge-cancel: result=false removed=false neoforge-break=1 fabric-before=0 fabric-after=0 fabric-canceled=0/,
                ~/\[VyneFixture\] fuel: dirt=1234 coal=1600 stone=0/,
                ~/\[VyneFixture\] sleep: time-allowed=null monsters-refused=NOT_SAFE spawn-refused=true spawn-other=false continue-refused=true conversions=1/,
                ~/\[VyneFixture\] bed: slept=true occupation=2 wake-up=1 direction-asked=true/,
                ~/\[VyneFixture\] items: stick-sharpness=true pickaxe-unbreaking=false pickaxe-sharpness=false bucket-remainder=minecraft:bucket stick-remainder=true modified-many=true sharpness-source=VANILLA/,
                ~/\[VyneFixture\] durability: handler-calls=2 damage-after-first=0 broken=true/,
                ~/\[VyneFixture\] ingredients: stick=true dirt=false list-first-diamond=true list-second-dirt=true encoded-fabric=true/,
                ~/\[VyneFixture\] payload: round-trip=hello from Fabric/,
                ~/\[VyneFixture\] menus: route=fabric close-asked=true language-stone=Stone/,
                ~/\[VyneFixture\] block-entity unload: stale-returned=true unload-fired=1/,
        ],
]

def serverCommand = { File vyneJar, String scenario ->
    def extraJvmFlags = []
    if (providers.gradleProperty('smoke.installer').isPresent()) extraJvmFlags += ['-Dvyne.hooks=false']
    def customJvmArgs = providers.gradleProperty('smoke.jvmArgs').orNull
    if (customJvmArgs) extraJvmFlags += customJvmArgs.split(',').findAll { !it.isBlank() }
    def maxHeap = providers.gradleProperty('smoke.xmx').orElse('2G').get()
    return ['java', '-Xmx' + maxHeap, '-Xms512M',
            '-Dvyne.dev=true',
            '-Djava.system.class.loader=dev.stolym.vyne.vcl.BridgeClassLoader',
            ] + extraJvmFlags + [
            '-cp', vyneJar.absolutePath,
            'dev.stolym.vyne.core.VyneLauncher',
            '--server']
}

def hasBundledLibraries = { File f ->
    if (f == null || !f.isFile()) return false
    try (def zf = new java.util.zip.ZipFile(f)) {
        return zf.getEntry('META-INF/libraries/') != null
    } catch (IOException ignored) {
        return false
    }
}

smokeScenarios.each { scenario ->
    tasks.register("smokeServer_${scenario}") {
        group = 'verification'
        description = "Boots a dedicated server with scenario '${scenario}' and checks the log."
        def shadow = tasks.named('shadowJar')
        dependsOn shadow
        if (scenario in fixtureScenarios) {
            dependsOn tasks.named('mixinFixtureJar')
        }

        doLast {
            File modsDir = project.file("smoke/scenarios/${scenario}/mods")
            if (!modsDir.isDirectory() && scenario != 'mixin-fixture') {
                throw new GradleException(
                        "Smoke scenario '${scenario}' is not provisioned: add mod jars to " +
                        "smoke/scenarios/${scenario}/mods/ (see docs/playtest.md, section 7).")
            }

            File vyneJar = shadow.get().archiveFile.get().asFile
            File runDir = layout.buildDirectory.dir("smoke/${scenario}").get().asFile
            project.delete(runDir)
            new File(runDir, 'mods').mkdirs()

            project.copy {
                from modsDir
                into new File(runDir, 'mods')
            }
            if (scenario in fixtureScenarios) {
                project.copy {
                    from tasks.named('mixinFixtureJar').get().archiveFile.get().asFile
                    into new File(runDir, 'mods')
                }
            }
            project.copy {
                from vyneJar
                into new File(runDir, 'mods')
            }
            new File(runDir, 'eula.txt').text = 'eula=true\n'
            int freePort = new ServerSocket(0).withCloseable { it.localPort }
            new File(runDir, 'server.properties').text = "server-port=${freePort}\n"


            def mcVersion = project.property('minecraft_version')
            File serverJar = new File(runDir, "minecraft_server.${mcVersion}.jar")
            if (!serverJar.exists()) {
                def explicit = providers.gradleProperty('smoke.serverJar').orNull
                File local = null
                if (explicit != null) {
                    local = project.file(explicit)
                } else {
                    def candidates = (fileTree(dir: 'run', include: ["minecraft_server.${mcVersion}.jar", 'versions/**/*.jar']).files
                            + fileTree(dir: 'run/versions', include: ["${mcVersion}/*.jar"]).files).unique()
                    local = candidates.find { f -> hasBundledLibraries(f) }
                }
                if (local == null || !local.isFile()) {
                    throw new GradleException(
                            "No vanilla server jar with bundled libraries found for the smoke test. Provide one via " +
                            "-Psmoke.serverJar=/path/to/server.jar or run the Vyne installer once " +
                            "to set up run/.")
                }
                try {
                    java.nio.file.Files.createSymbolicLink(serverJar.toPath(),
                            local.toPath())
                } catch (Exception ignored) {
                    java.nio.file.Files.copy(local.toPath(), serverJar.toPath())
                }
            }

            def boot = { String logName ->
                def proc = new ProcessBuilder(serverCommand(vyneJar, scenario))
                        .directory(runDir)
                        .redirectErrorStream(true)
                        .start()
                boolean timedOut = false
                boolean started = false
                def lines = []
                def watchdog = new Thread({
                    try {
                        Thread.sleep(smokeTimeoutSeconds * 1000L)
                        if (proc.alive) { timedOut = true; proc.destroyForcibly() }
                    } catch (InterruptedException ignored) { }
                })
                watchdog.daemon = true
                watchdog.start()
                proc.inputStream.eachLine { line ->
                    lines << line
                    if (!started && line.contains('Done (')) {
                        started = true
                        proc.outputStream.write('stop\n'.bytes)
                        proc.outputStream.flush()
                    }
                }
                int exit = proc.waitFor()
                watchdog.interrupt()
                new File(runDir, logName).text = lines.join('\n')
                def problems = []
                if (timedOut) problems << "timed out after ${smokeTimeoutSeconds}s"
                if (!started) problems << 'server never reached the "Done" line'
                if (started && exit != 0) problems << "server exited with code ${exit}"
                lines.each { l ->
                    if (forbiddenPatterns.any { it.matcher(l).find() } || l.contains('/ERROR]') || l.startsWith('[Vyne] ERROR')) problems << "log: ${l.take(200)}"
                }
                (expectedPatterns[scenario] ?: []).each { pat ->
                    if (!lines.any { pat.matcher(it).find() }) problems << "expected pattern not found in log: ${pat}"
                }
                if (problems) {
                    throw new GradleException("Smoke scenario '${scenario}' FAILED (${logName}):\n  - " + problems.join('\n  - ') +
                            "\nFull log: ${new File(runDir, logName)}")
                }
                return lines
            }

            boot('smoke.log')
            logger.lifecycle("Smoke scenario '${scenario}' passed (log: ${new File(runDir, 'smoke.log')})")
            if (providers.gradleProperty('smoke.secondBoot').isPresent()) {
                def second = boot('smoke-second.log')
                def redone = second.findAll { l -> firstLaunchOnly.any { it.matcher(l).find() } }
                if (redone) {
                    throw new GradleException("Smoke scenario '${scenario}': the second boot redid first-launch work:\n  - "
                            + redone.collect { it.take(200) }.join('\n  - ') + "\nFull log: ${new File(runDir, 'smoke-second.log')}")
                }
                logger.lifecycle("Smoke scenario '${scenario}' second boot reused every cache (log: ${new File(runDir, 'smoke-second.log')})")
            }
        }
    }
}

def clientKnownErrors = [
        ~/Can't open the resource index file/,
        ~/Couldn't set icon/,
        ~/\[CraftPresence\/ERROR\]: Unable to get "[a-z]+" pack data/,
]
def clientReadyPattern = ~/Created: \d+x\d+x\d+ minecraft:textures\/atlas\/gui\.png-atlas/
def clientSettleSeconds = 15

smokeScenarios.each { scenario ->
    tasks.register("smokeClient_${scenario}") {
        group = 'verification'
        description = "Boots the client under Xvfb with scenario '${scenario}' and checks it reaches the title screen."
        def shadow = tasks.named('shadowJar')
        dependsOn shadow, 'minecraftOfficialClientJar'
        if (scenario in fixtureScenarios) dependsOn tasks.named('mixinFixtureJar')
        def clientLibraries = configurations.minecraftLibraries
        def clientNatives = configurations.minecraftClientNatives
        def mappings = configurations.intermediaryMappings
        def officialClient = project.ext.minecraftOfficialClient
        def assetIndex = project.ext.minecraftAssetIndex

        doLast {
            if (['which', 'xvfb-run'].execute().waitFor() != 0) {
                throw new GradleException("smokeClient needs xvfb-run (package xvfb) to run the client without a screen")
            }
            File modsDir = project.file("smoke/scenarios/${scenario}/mods")
            File runDir = layout.buildDirectory.dir("smoke-client/${scenario}").get().asFile
            project.delete(runDir)
            new File(runDir, 'mods').mkdirs()
            new File(runDir, 'assets').mkdirs()
            if (modsDir.isDirectory()) project.copy { from modsDir; into new File(runDir, 'mods') }
            if (scenario in fixtureScenarios) {
                project.copy { from tasks.named('mixinFixtureJar').get().archiveFile.get().asFile; into new File(runDir, 'mods') }
            }
            new File(runDir, 'options.txt').text = 'onboardAccessibility:false\nnarrator:0\nsoundCategory_master:0.0\n'

            def classpath = [shadow.get().archiveFile.get().asFile] + officialClient.files + mappings.files + clientLibraries.files + clientNatives.files
            def maxHeap = providers.gradleProperty('smoke.xmx').orElse('3G').get()
            def command = ['xvfb-run', '-a', '-s', '-screen 0 1280x720x24',
                           'java', '-Xmx' + maxHeap, '-Xms512M', '-Dvyne.dev=true', '-Dvyne.earlyWindow=false',
                           '-cp', classpath*.absolutePath.join(File.pathSeparator),
                           'dev.stolym.vyne.core.VyneLauncher',
                           '--username', 'VyneSmoke', '--version', project.property('minecraft_version'),
                           '--gameDir', runDir.absolutePath, '--assetsDir', new File(runDir, 'assets').absolutePath,
                           '--assetIndex', assetIndex, '--uuid', '00000000000000000000000000000001',
                           '--accessToken', '0', '--userType', 'legacy', '--versionType', 'release']
            def proc = new ProcessBuilder(command).directory(runDir).redirectErrorStream(true).start()
            def lines = Collections.synchronizedList([])
            def readyAt = new java.util.concurrent.atomic.AtomicLong(0L)
            long deadline = System.currentTimeMillis() + smokeTimeoutSeconds * 1000L
            boolean exitedEarly = false
            Thread reader = null
            try {
                reader = Thread.start {
                    proc.inputStream.eachLine { line ->
                        lines << line
                        if (readyAt.get() == 0L && clientReadyPattern.matcher(line).find()) readyAt.set(System.currentTimeMillis())
                    }
                }
                while (proc.alive && System.currentTimeMillis() < deadline) {
                    long at = readyAt.get()
                    if (at != 0L && System.currentTimeMillis() - at > clientSettleSeconds * 1000L) break
                    Thread.sleep(500)
                }
                exitedEarly = !proc.alive
            } finally {
                proc.toHandle().descendants().each { it.destroyForcibly() }
                proc.destroyForcibly()
                proc.waitFor()
                reader?.join(5000)
            }
            boolean ready = readyAt.get() != 0L
            List<String> snapshot
            synchronized (lines) { snapshot = new ArrayList<>(lines) }
            lines = snapshot
            new File(runDir, 'smoke.log').text = lines.join('\n')

            def problems = []
            File crashes = new File(runDir, 'crash-reports')
            if (crashes.isDirectory() && crashes.listFiles()?.length) problems << "crash report written: ${crashes.listFiles()*.name.join(', ')}"
            if (!ready) problems << (exitedEarly ? 'client exited before reaching the title screen' : "client did not reach the title screen within ${smokeTimeoutSeconds}s")
            if (ready && exitedEarly) problems << 'client exited within ' + clientSettleSeconds + 's of reaching the title screen'
            lines.each { l ->
                boolean knownError = l.contains('/ERROR]') && clientKnownErrors.any { it.matcher(l).find() }
                if (forbiddenPatterns.any { it.matcher(l).find() } || l.contains('Game crashed')
                        || (l.contains('/ERROR]') && !knownError) || l.startsWith('[Vyne] ERROR')) problems << "log: ${l.take(200)}"
            }
            int errors = lines.count { it.contains('/ERROR]') }
            int skipped = lines.count { it.contains('found nothing to attach') && it.startsWith('[') }
            if (problems) {
                throw new GradleException("Client smoke scenario '${scenario}' FAILED:\n  - " + problems.join('\n  - ') +
                        "\nFull log: ${new File(runDir, 'smoke.log')}")
            }
            logger.lifecycle("Client smoke scenario '${scenario}' passed (${errors} ERROR lines, ${skipped} skipped mod hooks; log: ${new File(runDir, 'smoke.log')})")
        }
    }
}

tasks.register('smokeTest') {
    group = 'verification'
    description = 'Runs every smoke scenario.'
    dependsOn smokeScenarios.collect { "smokeServer_${it}" }
}

tasks.named('test') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('check') {
    dependsOn 'classLoadCheck'
}
