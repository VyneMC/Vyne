import groovy.json.JsonSlurper

def minecraftDir = layout.buildDirectory.dir('minecraft').get().asFile
def versionJson = new File(minecraftDir, "${project.minecraft_version}.json")
if (!versionJson.isFile()) {
    minecraftDir.mkdirs()
    def manifest = new JsonSlurper().parse(new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
    def entry = manifest.versions.find { it.id == project.minecraft_version }
    if (entry == null) throw new GradleException("Minecraft ${project.minecraft_version} is not in Mojang's version manifest")
    versionJson.text = new URL(entry.url).text
}
def versionMeta = new JsonSlurper().parse(versionJson)

configurations {
    minecraftLibraries {
        transitive = false
    }
}

dependencies {
    versionMeta.libraries.each { library ->
        if (library.name.split(':').length == 3) minecraftLibraries library.name
    }
}

def mojangJar = new File(minecraftDir, "minecraft-${project.minecraft_version}-mojang.jar")

tasks.register('minecraftMojangJar', JavaExec) {
    group = 'vyne'
    description = 'Builds the Minecraft client jar with Mojang names, for compiling against.'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.stolym.vyne.tools.minecraft.MojangJar'
    systemProperty 'vyne.gameDir', minecraftDir.absolutePath
    workingDir = minecraftDir
    args project.minecraft_version, mojangJar.absolutePath
    outputs.file(mojangJar)
    maxHeapSize = '2G'
}

ext.minecraftMojang = files(mojangJar) { builtBy 'minecraftMojangJar' } + configurations.minecraftLibraries

def runtimeJar = new File(minecraftDir, "minecraft-${project.minecraft_version}-runtime.jar")
def officialClientJar = new File(minecraftDir, "minecraft-${project.minecraft_version}-client-official.jar")

sourceSets {
    minecraftJar {
        java {
            srcDirs = ['src/minecraftJar/java']
        }
    }
}

configurations {
    intermediaryMappings {
        transitive = false
    }
}

dependencies {
    minecraftJarImplementation 'net.fabricmc:tiny-remapper:0.15.0'
    minecraftJarImplementation 'net.fabricmc:mapping-io:0.9.1'
    intermediaryMappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
}

tasks.register('minecraftOfficialClientJar') {
    group = 'vyne'
    description = 'Downloads the vanilla Minecraft client jar and checks its SHA-1.'
    def client = versionMeta.downloads.client
    outputs.file(officialClientJar)
    doLast {
        def tmp = new File(officialClientJar.parentFile, officialClientJar.name + '.part')
        new URL(client.url).withInputStream { input -> tmp.withOutputStream { it << input } }
        def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(tmp.bytes).encodeHex().toString()
        if (sha1 != client.sha1) {
            tmp.delete()
            throw new GradleException("Minecraft client jar SHA-1 mismatch: expected ${client.sha1}, got ${sha1}")
        }
        java.nio.file.Files.move(tmp.toPath(), officialClientJar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    onlyIf { !officialClientJar.isFile() }
}

tasks.register('minecraftRuntimeJar', JavaExec) {
    group = 'vyne'
    description = 'Builds the Minecraft client jar with runtime (intermediary) names, for compiling Vyne against.'
    dependsOn 'minecraftOfficialClientJar', tasks.named('minecraftJarClasses')
    classpath = sourceSets.minecraftJar.runtimeClasspath
    mainClass = 'dev.stolym.vyne.minecraftjar.RuntimeJar'
    def mappings = configurations.intermediaryMappings
    inputs.file(officialClientJar)
    inputs.files(mappings)
    outputs.file(runtimeJar)
    argumentProviders.add({ [officialClientJar.absolutePath, mappings.singleFile.absolutePath, runtimeJar.absolutePath] } as CommandLineArgumentProvider)
    maxHeapSize = '2G'
}

ext.minecraftRuntime = files(runtimeJar) { builtBy 'minecraftRuntimeJar' }

tasks.register('printMinecraftClasspath') {
    dependsOn 'minecraftMojangJar'
    doLast { println "MCCP=" + project.ext.minecraftMojang.files.join(File.pathSeparator) }
}

def hookDir = file("src/main/resources/vyne/hooks/neoforge-${project.hook_neoforge_version}")
def hookedJar = new File(minecraftDir, "minecraft-${project.minecraft_version}-hooked.jar")

tasks.register('minecraftHookedJar', JavaExec) {
    group = 'vyne'
    description = 'Minecraft with Mojang names plus Vyne\'s hook surface and access rules, for compiling Vyne\'s NeoForge API.'
    dependsOn 'minecraftMojangJar', tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.stolym.vyne.tools.minecraft.HookedJar'
    args mojangJar.absolutePath, new File(hookDir, 'surface.tsv').absolutePath,
            new File(hookDir, 'accesstransformer.cfg').absolutePath, hookedJar.absolutePath
    inputs.file(mojangJar)
    inputs.dir(hookDir)
    outputs.file(hookedJar)
}

ext.minecraftHooked = files(hookedJar) { builtBy 'minecraftHookedJar' } + configurations.minecraftLibraries

tasks.register('printHookedClasspath') {
    dependsOn 'minecraftHookedJar'
    doLast { println "HKCP=" + project.ext.minecraftHooked.files.join(File.pathSeparator) }
}

def hookedOpenJar = new File(minecraftDir, "minecraft-${project.minecraft_version}-hooked-open.jar")

tasks.register('minecraftHookedOpenJar', JavaExec) {
    group = 'vyne'
    description = 'The hooked Minecraft with every class and member public, for compiling Vyne\'s hook mixins.'
    dependsOn 'minecraftMojangJar', tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.stolym.vyne.tools.minecraft.HookedJar'
    args mojangJar.absolutePath, new File(hookDir, 'surface.tsv').absolutePath,
            new File(hookDir, 'accesstransformer.cfg').absolutePath, hookedOpenJar.absolutePath, '--open'
    inputs.file(mojangJar)
    inputs.dir(hookDir)
    outputs.file(hookedOpenJar)
}

ext.minecraftHookedOpen = files(hookedOpenJar) { builtBy 'minecraftHookedOpenJar' } + configurations.minecraftLibraries
