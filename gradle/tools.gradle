sourceSets {
    tools {
        java {
            srcDirs = ['src/tools/java']
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    hookFabricApi {
        transitive = false
    }
}

dependencies {
    hookFabricApi "net.fabricmc.fabric-api:fabric-api:${project.hook_fabric_api_version}"
}

tasks.register('hookInventory', JavaExec) {
    group = 'vyne'
    description = 'Lists every spot NeoForge and Fabric API change in vanilla Minecraft (data/hooks/).'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.stolym.vyne.tools.hooks.HookInventory'
    def work = layout.buildDirectory.dir('hook-inventory').get().asFile
    systemProperty 'vyne.gameDir', work.absolutePath
    workingDir = work
    doFirst { work.mkdirs() }
    args project.minecraft_version,
            project.hook_neoforge_version,
            "${-> configurations.hookFabricApi.singleFile.absolutePath}",
            project.hook_fabric_api_version,
            file('data/hooks').absolutePath
    maxHeapSize = '3G'
}

tasks.register('hookSurface', JavaExec) {
    group = 'vyne'
    description = 'Regenerates the NeoForge hook surface (interfaces, fields, methods NeoForge adds to vanilla).'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.stolym.vyne.tools.hooks.SurfaceExtract'
    def work = layout.buildDirectory.dir('hook-inventory').get().asFile
    systemProperty 'vyne.gameDir', work.absolutePath
    workingDir = work
    doFirst { work.mkdirs() }
    args project.hook_neoforge_version,
            file("src/main/resources/vyne/hooks/neoforge-${project.hook_neoforge_version}/surface.tsv").absolutePath
}

configurations {
    hookDecompiler {
        transitive = false
    }
}

dependencies {
    hookDecompiler 'org.vineflower:vineflower:1.10.1'
}

tasks.register('installHookNeoForge', JavaExec) {
    group = 'vyne'
    description = 'Installs NeoForge\'s patched game for the hook generator, without regenerating the hook surface.'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.stolym.vyne.tools.hooks.InstallNeoForge'
    def work = layout.buildDirectory.dir('hook-inventory').get().asFile
    systemProperty 'vyne.gameDir', work.absolutePath
    workingDir = work
    inputs.property('neoforgeVersion', project.hook_neoforge_version)
    outputs.file(new File(work, ".vyne/neoforge/${project.hook_neoforge_version}/client/install.properties"))
    doFirst { work.mkdirs() }
    args project.hook_neoforge_version
}

tasks.register('decompileHookClasses', JavaExec) {
    group = 'vyne'
    description = 'Decompiles the vanilla classes NeoForge changes (from NeoForge\'s patched game) for the hook generator.'
    dependsOn 'installHookNeoForge'
    classpath = configurations.hookDecompiler
    mainClass = 'org.jetbrains.java.decompiler.main.decompiler.ConsoleDecompiler'
    def work = layout.buildDirectory.dir('hook-inventory').get().asFile
    def input = new File(work, 'decompile-input')
    def output = new File(work, 'decompiled')
    inputs.file("src/main/resources/vyne/hooks/neoforge-${project.hook_neoforge_version}/surface.tsv")
    inputs.property('neoforgeVersion', project.hook_neoforge_version)
    outputs.dir(output)
    doFirst {
        delete input, output
        input.mkdirs()
        output.mkdirs()
        def patched = fileTree(new File(work, ".vyne/neoforge/${project.hook_neoforge_version}/client")).matching {
            include "neoforge-${project.hook_neoforge_version}-client.jar"
        }.singleFile
        def owners = file("src/main/resources/vyne/hooks/neoforge-${project.hook_neoforge_version}/surface.tsv")
                .readLines().drop(1).collect { it.split('\t')[0] }.toSet()
        copy {
            from(zipTree(patched)) {
                include { el ->
                    if (el.directory) return true
                    def name = el.relativePath.pathString
                    if (!name.endsWith('.class')) return false
                    def outer = name.substring(0, name.length() - 6)
                    int dollar = outer.indexOf('$')
                    owners.contains(outer) || (dollar > 0 && owners.contains(outer.substring(0, dollar)))
                }
            }
            into input
        }
        args '-dgs=1', '-rsy=1', '-rbr=1', '-ind=    ', input.absolutePath, output.absolutePath
    }
}

tasks.register('generateHookBodies', JavaExec) {
    group = 'vyne'
    description = 'Generates Vyne mixins with the bodies of the methods NeoForge adds to vanilla (src/hooks/generated).'
    dependsOn tasks.named('toolsClasses'), 'minecraftHookedOpenJar', 'decompileHookClasses'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.stolym.vyne.tools.hooks.HookBodies'
    def work = layout.buildDirectory.dir('hook-inventory').get().asFile
    inputs.files(sourceSets.tools.runtimeClasspath)
    inputs.dir(new File(work, 'decompiled'))
    inputs.file("src/main/resources/vyne/hooks/neoforge-${project.hook_neoforge_version}/surface.tsv")
    inputs.file("src/main/resources/vyne/hooks/neoforge-${project.hook_neoforge_version}/accesstransformer.cfg")
    inputs.file('src/hooks/generated/hook-exclusions.txt')
    outputs.dir('src/hooks/generated/java')
    outputs.file('src/hooks/generated/resources/vyne.hooks.generated.mixins.json')
    outputs.upToDateWhen { !project.hasProperty('hookErrors') }
    doFirst { delete 'src/hooks/generated/java' }
    doFirst {
        def errors = project.findProperty('hookErrors')
        args = [file("src/main/resources/vyne/hooks/neoforge-${project.hook_neoforge_version}/surface.tsv").absolutePath,
                new File(work, 'decompiled').absolutePath,
                layout.buildDirectory.file("minecraft/minecraft-${project.minecraft_version}-hooked-open.jar").get().asFile.absolutePath,
                file('src/hooks/generated/java').absolutePath,
                file('src/hooks/generated/resources/vyne.hooks.generated.mixins.json').absolutePath,
                file('src/hooks/generated/hook-exclusions.txt').absolutePath,
                new File(work, 'hook-spans.tsv').absolutePath] + (errors ? [errors.toString()] : [])
    }
}
